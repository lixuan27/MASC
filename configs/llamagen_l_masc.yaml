# LlamaGen-L + MASC on ImageNet-1K 256x256 (Appendix A.2 / Table 8).

backbone:
  name: llamagen_l
  params: 311M               # +MASC variant (Table 1)
  image_size: 256
  tokenizer: llamagen_vq16384

masc:
  k: 8192
  decode: random_sampling

optimizer:
  name: adamw
  peak_lr: 1.0e-4
  final_lr: 1.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.05

train:
  epochs: 300
  global_batch_size: 256
  total_steps: null
  grad_clip: 1.0
  amp: true
  ckpt_every: 10000

num_workers: 8
log_every: 50
