# LlamaGen-XL + MASC on ImageNet-1K 256x256.
# Hyperparameters follow Appendix A.2 / Table 8 of the paper.  Architectural
# fields under `backbone` are consumed by your backbone adapter (the official
# LlamaGen-XL config); only the `masc` block and the optimiser/schedule are owned
# by this repo.

backbone:
  name: llamagen_xl          # resolved by your `backbones.build_backbone`
  params: 719M               # +MASC variant (Table 1)
  image_size: 256
  tokenizer: llamagen_vq16384 # finalised VQ-VAE codebook, N = 16384

masc:
  k: 8192                    # default coarse vocabulary (Table 1); 4096 peaks FID (Table 2)
  decode: random_sampling    # default decoder (Section 3.3 / Table 10)

optimizer:
  name: adamw
  peak_lr: 2.0e-4
  final_lr: 2.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.05

train:
  epochs: 300
  global_batch_size: 512
  total_steps: null          # set = epochs * (num_images / global_batch_size)
  grad_clip: 1.0
  amp: true
  ckpt_every: 10000

num_workers: 8
log_every: 50
